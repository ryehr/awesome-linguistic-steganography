# Evaluation metrics; `tracked_as` links a metric to the adoption statistics.
# Schema and contribution guide: CONTRIBUTING.md.  Seeded from the survey; edit freely.

- id: text_kld
  name: Text-level KL divergence
  group: security
  subgroup: KL divergence
  direction: lower
  tracked_as: text_kld
  description: KL divergence between Gaussian fits of covertext and stegotext sentence embeddings.
  references:
  - title: "VAE-Stega: Linguistic Steganography Based on Variational Auto-Encoder"
    year: 2021
    url: "https://doi.org/10.1109/TIFS.2020.3023279"
  - title: Provably Secure Generative Linguistic Steganography
    year: 2021
    url: "https://aclanthology.org/2021.findings-acl.268/"

- id: step_kld
  name: Step-level KL divergence
  group: security
  subgroup: KL divergence
  direction: lower
  tracked_as: step_kld
  description: "Average KL divergence between the LM's next-token distribution and the steganographic sampling distribution."
  references:
  - title: Towards Near-imperceptible Steganographic Text
    year: 2019
    url: "https://aclanthology.org/P19-1422"
  - title: Neural Linguistic Steganography
    year: 2019
    url: "https://aclanthology.org/D19-1115"

- id: jsd
  name: KL variants (e.g. Jensen–Shannon divergence)
  group: security
  subgroup: KL divergence
  direction: lower
  description: Symmetric or bounded variants of the KL divergence.
  references:
  - title: "VAE-Stega: Linguistic Steganography Based on Variational Auto-Encoder"
    year: 2021
    url: "https://doi.org/10.1109/TIFS.2020.3023279"
  - title: Zero-shot Generative Linguistic Steganography
    year: 2024
    url: "https://aclanthology.org/2024.naacl-long.289/"

- id: ppl
  name: Perplexity (PPL)
  group: security
  subgroup: text quality
  direction: lower
  tracked_as: ppl
  description: Fluency of the stegotext under an evaluation LM; also reported as ΔPPL to covertexts.
  references:
  - {title: Perplexity—a measure of the difficulty of speech recognition tasks, year: 1977}

- id: bleu
  name: BLEU
  group: security
  subgroup: text quality
  direction: higher
  tracked_as: bleu
  description: n-gram precision against a reference (covertext).
  references:
  - title: "Bleu: a method for automatic evaluation of machine translation"
    year: 2002

- id: rouge
  name: ROUGE
  group: security
  subgroup: text quality
  direction: higher
  tracked_as: rouge
  description: n-gram / LCS recall against a reference.
  references:
  - title: "ROUGE: A Package for Automatic Evaluation of Summaries"
    year: 2004
    url: "https://www.aclweb.org/anthology/W04-1013"

- id: meteor
  name: METEOR
  group: security
  subgroup: text quality
  direction: higher
  tracked_as: meteor
  description: Unigram alignment with precision/recall and a fragmentation penalty.
  references:
  - title: "METEOR: An Automatic Metric for MT Evaluation with Improved Correlation with Human Judgments"
    year: 2005
    url: "https://www.aclweb.org/anthology/W05-0909"

- id: distinct_n
  name: Diversity (distinct-n)
  group: security
  subgroup: text quality
  direction: higher
  tracked_as: distinct_n
  description: Ratio of unique to total n-grams.
  references:
  - title: A Diversity-Promoting Objective Function for Neural Conversation Models
    year: 2016
    url: "https://aclanthology.org/N16-1014/"
- {id: human_eval, name: Human evaluation, group: security, subgroup: text quality, direction: n/a, tracked_as: human_eval,
  description: 'Human ratings of fluency, naturalness, logic, or detectability.'}

- id: llm_judge
  name: LLM-as-a-judge
  group: security
  subgroup: text quality
  direction: n/a
  tracked_as: llm_judge
  description: An LLM rates or detects stegotexts as a proxy for human judgement.
  references:
  - title: A Survey on LLM-as-a-Judge
    year: 2025
    url: "https://arxiv.org/abs/2411.15594"
- {id: accuracy, name: Steganalysis accuracy, group: security, subgroup: steganalysis, direction: lower, tracked_as: steganalysis,
  description: Accuracy of a steganalyzer distinguishing stegotexts from covertexts.}
- {id: precision, name: Steganalysis precision, group: security, subgroup: steganalysis, direction: lower, tracked_as: steganalysis,
  description: Precision of the steganalyzer.}
- {id: recall, name: Steganalysis recall, group: security, subgroup: steganalysis, direction: lower, tracked_as: steganalysis,
  description: Recall of the steganalyzer.}
- {id: f1, name: Steganalysis F1, group: security, subgroup: steganalysis, direction: lower, tracked_as: steganalysis, description: F1
    score of the steganalyzer.}

- id: bpt
  name: Bits per token (BPT)
  group: efficiency
  subgroup: embedding capacity
  direction: higher
  tracked_as: bpt
  description: Embedded bits divided by stegotext tokens (also bits per word).
  references:
  - title: Generating Steganographic Text with LSTMs
    year: 2017
    url: "https://aclanthology.org/P17-3017/"
  - title: "RNN-Stega: Linguistic Steganography Based on Recurrent Neural Networks"
    year: 2019
    url: "https://doi.org/10.1109/TIFS.2018.2871746"

- id: entropy_util
  name: Entropy utilization
  group: efficiency
  subgroup: embedding capacity
  direction: higher
  tracked_as: entropy_util
  description: Embedded bits divided by the summed entropy of the sampling distributions; model-independent.
  references:
  - title: "Discop: Provably Secure Steganography in Practice Based on \"Distribution Copies\""
    year: 2023
    url: "https://doi.org/10.1109/SP46215.2023.10179287"

- id: embedding_rate
  name: Embedding rate (ER)
  group: efficiency
  subgroup: embedding capacity
  direction: higher
  tracked_as: embedding_rate
  description: "Payload bits as a percentage of the stegotext's encoded size."
- {id: embed_time_bit, name: Embedding time per bit, group: efficiency, subgroup: operation speed, direction: lower, tracked_as: speed,
  description: e.g. ms/bit.}
- {id: extract_time_bit, name: Extraction time per bit, group: efficiency, subgroup: operation speed, direction: lower, tracked_as: speed,
  description: e.g. ms/bit.}
- {id: embed_time_text, name: Embedding time per stegotext, group: efficiency, subgroup: operation speed, direction: lower,
  tracked_as: speed, description: e.g. ms/text.}
- {id: extract_time_text, name: Extraction time per stegotext, group: efficiency, subgroup: operation speed, direction: lower,
  tracked_as: speed, description: e.g. ms/text.}

- id: mer
  name: Message error rate (MER)
  group: robustness
  subgroup: error rate
  direction: lower
  tracked_as: error_rate
  description: Fraction of stegotexts whose extracted message differs from the embedded one.
  references:
  - title: Addressing Segmentation Ambiguity in Neural Linguistic Steganography
    year: 2022
    url: "https://aclanthology.org/2022.aacl-short.15"
- {id: ber, name: Bit error rate (BER), group: robustness, subgroup: error rate, direction: lower, tracked_as: error_rate,
  description: Fraction of wrongly extracted bits; length mismatches must be handled explicitly.}
